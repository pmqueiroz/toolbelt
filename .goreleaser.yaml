version: 2

project_name: tb

builds:
  - main: ./cmd/tb
    binary: tb
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }}

archives:
  - name_template: "tb_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - none*

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  github:
    owner: pmqueiroz
    name: toolbelt
